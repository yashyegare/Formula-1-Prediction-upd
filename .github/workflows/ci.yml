name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flask:
    name: Flask Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Verify app loads
        run: python -c "from app import app; print('Flask OK')"
      - name: Verify database
        run: python -c "from database import init_db, is_seeded; init_db(); print('DB OK, seeded:', is_seeded())"

  flask-postgres:
    name: Flask Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sslmode=disable: the service container has no TLS. database.py
      # respects an sslmode already present in the URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/f1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests against PostgreSQL
        run: python -m pytest tests/ -q

  nextjs:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx next build

  astro:
    name: Season Simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1-points-calc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: f1-points-calc/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies (blocking)
        run: |
          pip install pip-audit
          pip-audit -r flask-app/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit Next.js production dependencies (blocking)
        working-directory: nextjs-app
        run: npm audit --omit=dev
      - name: Audit Season Simulator production dependencies (report-only)
        working-directory: f1-points-calc
        # Astro 5's remaining advisories (astro XSS set, @astrojs/tailwind)
        # are only patched in Astro 7, which requires a Tailwind v4 migration
        # (@astrojs/tailwind is deprecated). sharp/esbuild are already fixed
        # via package.json overrides. Flip this step to blocking (remove
        # continue-on-error) once the Astro 7 upgrade lands.
        continue-on-error: true
        run: npm audit --omit=dev
