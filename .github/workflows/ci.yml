name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never launch a deploy while a previous deploy for the same branch is still
# polling its smoke-check — and supersede stale in-flight CI runs entirely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flask:
    name: Flask Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Verify app loads
        run: python -c "from app import app; print('Flask OK')"
      - name: Verify database
        run: python -c "from database import init_db, is_seeded; init_db(); print('DB OK, seeded:', is_seeded())"
      - name: Guard the shipped season database
        # f1_data.db is COMMITTED (the whole point: /api/init serves from it
        # instantly; without it every year falls into a ~90s live-Jolpica
        # fallback that starves the whole service). This guard fails CI if
        # the shipped copy goes incomplete or stops serving the frontend's
        # contract — the failure mode that motivated it was a payload shape
        # only wrong on a path nothing exercised.
        run: |
          python - <<'PY'
          from database import get_season_init_data

          import sqlite3
          conn = sqlite3.connect("f1_data.db")
          years = [r[0] for r in conn.execute("SELECT year FROM seasons ORDER BY year")]
          expected = list(range(1981, 2027))
          assert years == expected, f"shipped DB seasons {years} != {expected}"
          results = conn.execute("SELECT COUNT(*) FROM results").fetchone()[0]
          assert results > 10000, f"shipped DB has only {results} result rows"
          conn.close()

          # The SQLite path must actually serve (not None = fallback not needed)
          data = get_season_init_data(2024)
          assert data is not None, "get_season_init_data(2024) returned None"
          assert data["schedule"] and len(data["schedule"]) >= 20
          assert all(k.startswith("2024_r") for k in data["raceResults"]), \
              "raceResults must be keyed by <year>_r<round> (frontend contract)"
          assert all("id" in t and "constructorId" not in t for t in data["teams"]), \
              "teams must use the frontend's {id, ...} contract"
          assert all("driverId" in s for s in data["driverStandings"]), \
              "standings must use driverId/teamId, not entityId"
          print(f"Shipped DB OK: {len(years)} seasons, {results} results, contract intact")
          PY

  flask-postgres:
    name: Flask Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sslmode=disable: the service container has no TLS. database.py
      # respects an sslmode already present in the URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/f1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests against PostgreSQL
        run: python -m pytest tests/ -q

  nextjs:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx next build

  astro:
    name: Season Simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1-points-calc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: f1-points-calc/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guard year pages exist in the build
        # The Season Simulator serves /1981../2026 as static pages. A build
        # regression that drops them (broken getStaticPaths, routing change)
        # would 404 every year link while CI still reported green.
        run: |
          count=$(ls dist | grep -cE '^(19|20)[0-9]{2}\.html')
          for y in $(seq 1981 2026); do
            [ -f "dist/$y.html" ] || { echo "::error::dist/$y.html missing - year page build broke"; exit 1; }
          done
          echo "All $count year pages built (1981-2026)."

  ml-pipeline:
    name: ML Pipeline (tests + drift guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-notebooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run ML pipeline tests
        run: python -m pytest tests/ -q
      - name: Guard against stale committed artifacts
        # cleaned_data.csv and current_roster.json are DERIVED files: a stale
        # committed copy silently diverges from what the scripts produce
        # (this shipped once - an old-schema CSV crashed train_model.py with
        # a KeyError on the new feature columns). Rebuild from the raw
        # datasets and byte-compare; a diff means someone edited data or
        # features without re-running the pipeline. rffinal.pkl is
        # deliberately NOT compared: pickles are not byte-deterministic.
        run: |
          mkdir -p /tmp/rebuild
          python build_training_data.py --datasets ./datasets --out /tmp/rebuild
          for f in cleaned_data.csv current_roster.json; do
            if ! cmp -s "datasets/$f" "/tmp/rebuild/$f"; then
              echo "::error::datasets/$f is stale - it no longer matches what build_training_data.py produces from the committed raw datasets."
              echo "Regenerate locally: cd model-notebooks && python build_training_data.py --datasets ./datasets --out ./datasets"
              diff "datasets/$f" "/tmp/rebuild/$f" | head -20 || true
              exit 1
            fi
          done
          echo "Committed derived artifacts match the pipeline output."
      - name: Guard against stale serving copies
        # flask-app keeps its own copies of the artifacts it loads at startup
        # (rffinal.pkl, current_roster.json). They are NOT rebuilt by CI, so a
        # retrain can silently leave the serving roster behind (roster values
        # feed live predictions). The model notebook copy is guard-checked
        # above; here we pin the serving copy to it byte-for-byte. rffinal.pkl
        # is excluded everywhere: pickles are not byte-deterministic.
        run: |
          if ! cmp -s ../flask-app/current_roster.json datasets/current_roster.json; then
            echo "::error::flask-app/current_roster.json is stale - the serving copy must match model-notebooks/datasets/current_roster.json."
            echo "Fix: cp model-notebooks/datasets/current_roster.json flask-app/current_roster.json"
            exit 1
          fi
          echo "Serving roster copy matches the canonical build."

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies (blocking)
        run: |
          pip install pip-audit
          pip-audit -r flask-app/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit Next.js production dependencies (blocking)
        working-directory: nextjs-app
        run: npm audit --omit=dev
      - name: Audit Season Simulator production dependencies (report-only)
        working-directory: f1-points-calc
        # Astro 5's remaining advisories (astro XSS set, @astrojs/tailwind)
        # are only patched in Astro 7, which requires a Tailwind v4 migration
        # (@astrojs/tailwind is deprecated). sharp/esbuild are already fixed
        # via package.json overrides. Flip this step to blocking (remove
        # continue-on-error) once the Astro 7 upgrade lands.
        continue-on-error: true
        run: npm audit --omit=dev

  live-smoke:
    name: Live Deployment Smoke Tests
    runs-on: ubuntu-latest
    # Genuine production checks: they verify the real deployed URLs, so a
    # failure means a stale/broken deployment, not a code regression in this
    # push. Use continue-on-error so an ambient outage can't block unrelated
    # merges while still being loudly visible.
    continue-on-error: true
    steps:
      - name: API — health, init, circuits, roster
        run: |
          API=https://f1-predictor-api-nddf.onrender.com
          for path in "/health" "/api/init?year=2024" "/api/circuits" "/roster"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API$path")
            echo "$path -> $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::API $path returned $STATUS"
              exit 1
            fi
          done
      - name: API — init speed (seeded DB fast path)
        run: |
          # The committed f1_data.db must serve /api/init in ~1s; a regression
          # to the 90s+ Jolpica fallback would starve the 2-worker service.
          SECS=$(curl -s -o /dev/null -w "%{time_total}" --max-time 15 "https://f1-predictor-api-nddf.onrender.com/api/init?year=1984")
          echo "init(1984) took ${SECS}s"
          awk -v t="$SECS" 'BEGIN { exit !(t < 5) }' || { echo "::warning::init latency regressed (${SECS}s)"; exit 1; }
      - name: API — CORS allowlist live (no foreign reflection, both frontends allowed)
        run: |
          API=https://f1-predictor-api-nddf.onrender.com
          # 1) A foreign origin must get NO Access-Control-Allow-Origin.
          #    (A bare @cross_origin() once reflected any Origin on /predictGrid,
          #    silently bypassing the CORS_ORIGINS allowlist.)
          if curl -s -D - -o /dev/null --max-time 30 -H "Origin: https://evil-test.example.com" "$API/roster" \
               | grep -qi "access-control-allow-origin"; then
            echo "::warning::API reflects foreign origins on /roster - allowlist bypassed"
            exit 1
          fi
          # 2) Both deployed frontends MUST stay allowlisted - a missing origin
          #    silently breaks that app's browser requests (roster/predictions).
          for origin in \
            https://nextjs-app-yashyegare.vercel.app \
            https://formula-1-prediction-upd-fxzg.vercel.app; do
            if ! curl -s -D - -o /dev/null --max-time 30 -H "Origin: $origin" "$API/roster" \
                 | grep -qi "access-control-allow-origin: $origin"; then
              echo "::warning::$origin missing from live CORS allowlist"
              exit 1
            fi
            echo "$origin allowlisted OK"
          done
      - name: Predictor — homepage serves current build
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://nextjs-app-yashyegare.vercel.app)
          [ "$STATUS" = "200" ] || { echo "::warning::predictor homepage -> $STATUS"; exit 1; }
          # The old code hardcoded the 2023 grid into the SSR HTML; the current
          # app fetches /roster client-side. Presence of a 2023-only driver is
          # the fingerprint of a stale deployment.
          if curl -s --max-time 30 https://nextjs-app-yashyegare.vercel.app | grep -qi "magnussen"; then
            echo "::warning::predictor is serving the stale hardcoded-2023 build"; exit 1
          fi
      - name: Simulator — homepage, year pages, track pages
        run: |
          SIM=https://formula-1-prediction-upd-fxzg.vercel.app
          for path in "/" "/2024" "/1984" "/tracks/monaco"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SIM$path")
            echo "$path -> $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::simulator $path returned $STATUS"
              exit 1
            fi
          done

  deploy-render:
    name: Deploy Backend to Render
    # ml-pipeline gates the deploy too: a push ships the model artifacts, so
    # a failing ML suite or a stale-artifact drift should block it.
    needs: [flask, flask-postgres, dependency-audit, ml-pipeline]
    # Only auto-deploy on pushes to main once the backend test suites pass.
    # Frontend jobs deliberately do NOT gate this: the backend is a separate
    # deployable, and a frontend-only failure shouldn't block backend fixes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: hook
        name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set - automated deploy skipped."
            echo "To enable: Render dashboard -> f1-predictor-api -> Settings -> Deploy Hook,"
            echo "copy the URL, then add it in GitHub repo Settings -> Secrets and variables -> Actions."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HTTP=$(curl -s -o /tmp/hook-response.json -w "%{http_code}" -X POST "$HOOK_URL")
          echo "Deploy hook responded: $HTTP"
          cat /tmp/hook-response.json; echo
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ] && [ "$HTTP" != "202" ]; then
            echo "Deploy hook failed"
            exit 1
          fi
          echo "triggered=true" >> "$GITHUB_OUTPUT"
      - name: Smoke-check the service after deploy
        # Meaningless without a deploy - don't poll if the hook never fired.
        if: steps.hook.outputs.triggered == 'true'
        run: |
          # The new deploy either swaps in cleanly (health stays 200) or the
          # service crashes at boot (health starts failing). This catches the
          # boot-crash case that previously required a manual dashboard check.
          sleep 120
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://f1-predictor-api-nddf.onrender.com/health)
            echo "[$i] /health -> $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy after deploy"
              exit 0
            fi
            sleep 20
          done
          echo "Backend did not report healthy within the deploy window"
          exit 1
      - name: Notify on failure
        # The body skips gracefully when the webhook secret is unset.
        if: failure()
        env:
          # Slack-compatible webhook. Render/GitHub Actions docs use Slack;
          # Discord works by appending /slack to its webhook URL.
          WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_NOTIFICATION_WEBHOOK not set - failure notification skipped."
            exit 0
          fi
          MSG=$(printf ':x: Render deploy FAILED for %s@%s\nRun: %s\nProd keeps running the previous known-good deploy.' \
            "$REPO" "${SHA:0:7}" "$RUN_URL")
          # json.dumps guarantees valid JSON regardless of shell quoting.
          MSG="$MSG" python3 -c 'import json, os; print(json.dumps({"text": os.environ["MSG"]}))' > /tmp/payload.json
          curl -s -X POST -H 'Content-Type: application/json' -d @/tmp/payload.json "$WEBHOOK_URL" > /dev/null || \
            echo "::warning::Notification webhook POST failed (deploy failure already logged)"
