name: Keep Render Alive

on:
  schedule:
    # Every 10 minutes (cron has minute granularity, so we use two 5-min offsets)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          # A Render free-tier cold start routinely takes 60-90s, and this
          # ping is often the request that wakes the service. The old
          # --max-time 30 could never outlast the boot it triggered, so
          # every cold-night run "failed" while the service came up right
          # after — which is what filled the mailbox. Three attempts with
          # a generous budget only alert on genuine downtime.
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://f1-predictor-api-nddf.onrender.com/health || echo "000")
            echo "attempt $i: health returned $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Service awake/healthy"
              exit 0
            fi
            sleep 20
          done
          echo "::error::F1 API health check failed after 3 attempts"
          exit 1
      - name: Notify when the API is down
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_NOTIFICATION_WEBHOOK not set - downtime alert skipped."
            exit 0
          fi
          # json.dumps guarantees valid JSON regardless of shell quoting.
          MSG=$(printf ':rotating_light: F1 API health check FAILED (keep-alive ping)\nhttps://f1-predictor-api-nddf.onrender.com/health did not return 200.\nCheck: https://dashboard.render.com')
          MSG="$MSG" python3 -c 'import json, os; print(json.dumps({"text": os.environ["MSG"]}))' > /tmp/payload.json
          curl -s -X POST -H 'Content-Type: application/json' -d @/tmp/payload.json "$WEBHOOK_URL" > /dev/null || \
            echo "::warning::Notification webhook POST failed"
