name: Keep Render Alive

on:
  schedule:
    # Every 10 minutes (cron has minute granularity, so we use two 5-min offsets)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://f1-predictor-api-nddf.onrender.com/health)
          echo "Health check returned: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: health check did not return 200"
            exit 1
          fi
